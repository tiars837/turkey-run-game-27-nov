<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Run! — A Turkey's Thanksgiving Escape</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2a1a0e;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", Verdana, sans-serif;
  }
  #wrap {
    width: min(1280px, 100vw);
    aspect-ratio: 1280 / 720;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
    cursor: pointer;
    background: #ffb36b;
  }
  #hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 6px;
    text-align: center;
    color: #d8c9a8;
    font-size: 13px;
    letter-spacing: 0.4px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="hint">SPACE / click — jump &nbsp;·&nbsp; ↓ — duck / hide in hay &nbsp;·&nbsp; → — sprint &nbsp;·&nbsp; M — mute &nbsp;·&nbsp; R — restart</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
